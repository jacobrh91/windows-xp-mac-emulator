[package]
name = "windows-xp-mac-emulator"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
fontdue = "0.9.5"
metal = "0.33.0"
minifb = "0.29.0"
nanomp3-core = "0.2.0"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
